<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS 2000</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="backendEvents.js"></script>
</head>
<body>
    <div class="container">
        <!-- Contenedor lateral (Sidebar + Canales + Panel de usuario) -->
        <div class="sidebar-container">
            <!-- Sidebar (Servidores) -->
            <div class="sidebar">
                <button class="server-icon" id="DS2000-button">D</button>
                <button class="server-icon">+</button>
            </div>

            <!-- Lista de canales -->
            <div class="channel-list">
                <h3>DS 2000</h3>
                <ul>
                    <li># general</li>
                    <li># memes</li>
                    <li># música</li>
                </ul>
            </div>
            <!-- Panel de usuario -->
            <div class="user-panel">
                <div class="user-avatar"></div>
                <div class="user-info">
                    <div class="user-name">Lucas</div>
                </div>
                <div class="user-icons">
                    <div class="icon" id="mic-icon">🎤</div>
                    <div class="icon" id="headset-icon">🎧</div>
                </div>
            </div>            
        </div>

        <!-- Chat -->
        <div class="chat">
            <div class="chat-header"># general</div>
            <div class="chat-messages">
                <div class="message">
                    <span class="username">Lucas:</span> Hola, esto es un chat falso.
                </div>
                <div class="message">
                    <span class="username">Bot:</span> ¡Bienvenido a Fake Discord!
                </div>
            </div>
            <input type="text" class="chat-input" placeholder="Escribe un mensaje...">
        </div>
    </div>
</body>
</html>
