[package]
name = "DS-2000"
version = "0.1.0"
edition = "2021"


[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }

[dependencies]
named_pipe = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
directories = "6.0"
serialport = "4.7"
tauri = { version = "2.4.0", features = [] }
tauri-plugin-log = "2.0.0-rc"
log = "0.4"
